apply plugin: 'com.android.application'

// The version comes from the repository, as it does for the Switch NACP and
// engine/version.sh: the build number is the commit count. versionCode has to
// grow for Android to accept an update, and a later commit always has more
// commits behind it, so an APK from a later commit always installs over an
// earlier one. Falls back to 1 / "3.0" when git is not reachable.
// It is read from engine/version.h, which engine/version.sh writes from git
// (build-android.sh runs it first); that keeps this file free of any git
// plumbing and in step with the string the engine prints into its log.
def gitBuild = { ->
    try {
        def m = (file("${project.rootDir}/../version.h").text =~ /VERSION_BUILD\s+"(\d+)"/)
        m.find() ? m.group(1).toInteger() : 0
    } catch (ignored) {
        0
    }
}()

android {
  compileSdkVersion 35
    defaultConfig {
      minSdkVersion 21
        targetSdkVersion 35

        //////////// MODFY FOR CUSTOM APK /////////////////
        applicationId "org.openbor.engine2018"
        namespace "org.openbor.engine"
        versionCode gitBuild > 0 ? gitBuild : 1
        versionName gitBuild > 0 ? "3.0.${gitBuild}" : "3.0"
        resValue "string", "app_name", "OpenBOR 2018"
        ///////////////////////////////////////////////////

        externalNativeBuild {
          ndkBuild {
              // currently supports with pre-built libraries for following
              // two target abis removed arm64 as unsupported for now
              abiFilters 'arm64-v8a', 'armeabi-v7a'
          }
        }
    }

  signingConfigs {
        debug {
        // ... your debug keystore details here ...
        // For example, if you have a debug.keystore in your project root
        storeFile file('debug.keystore')
        storePassword 'android' // Default password for debug keystore
        keyAlias 'androiddebugkey' // Default alias
        keyPassword 'android' // Default password for alias
    }
    
    release {
      // keystore.properties sits next to settings.gradle and is gitignored;
      // without it a release build comes out unsigned, which is what you want
      // on a machine that has no business signing.
      def keystorePropertiesFile = rootProject.file("keystore.properties")
      if (keystorePropertiesFile.exists()) {
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
        storeFile file(keystoreProperties['storeFile'])
        storePassword keystoreProperties['storePassword']
      }
    }
  }

  buildTypes {
  
  android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "OpenBOR2018.apk";
		}
	}
     debug {
        // Do NOT add 'signingConfig signingConfigs.release' here
        // It should inherit the default debug signing or you define 'signingConfig signingConfigs.debug'
    }
    release {
      minifyEnabled false
        proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        signingConfig signingConfigs.release
    }
  }

  if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
    sourceSets.main {
      jniLibs.srcDir 'libs'
    }
    externalNativeBuild {
      ndkBuild {
        path 'jni/Android.mk'
      }
    }

  }

  lintOptions {
    abortOnError false
  }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    ndkVersion '21.4.7075529'
    buildToolsVersion '36.0.0'
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation 'androidx.appcompat:appcompat:1.0.2'
  implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.0"))
  //needed to fix sdk 34+ crashing
  implementation 'org.jetbrains:annotations:16.0.2'
}